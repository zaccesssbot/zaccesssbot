# compile-checks and imports the card generator on every pull request, so a broken change fails
# here instead of at the next scheduled refresh. The import runs nothing: the generator only
# talks to the network inside main().

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the card generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Compile
        run: python -m compileall -q profile/generate_card.py

      - name: Import
        run: python -c "import sys; sys.path.insert(0, 'profile'); import generate_card"
