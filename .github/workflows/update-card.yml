# refreshes the profile card's live stats four times a day. Uses ACCESS_TOKEN (a classic PAT
# with public_repo scope) rather than the run's own built in token, since the built in token
# cannot read this account's gists (403 on that endpoint specifically).
name: Update profile card

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Generate
        run: python generate_card.py
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "zaccesssbot"
          git config user.email "automation@isaacadjei.me"
          git add profile/
          git diff --staged --quiet || git commit -m "chore: refresh profile card stats"
          git push
