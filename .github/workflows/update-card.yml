# refreshes the profile card's live stats four times a day. Uses ACCESS_TOKEN (a classic PAT
# with public_repo scope) rather than the run's own built in token, since the built in token
# cannot read this account's gists (403 on that endpoint specifically). Also bumps the README's
# image version query param on every run, so GitHub's raw content cache can never serve a stale
# card after the SVGs change.
name: Update profile card

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Generate
        run: python profile/generate_card.py
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      - name: Bump the README's cache-busting version
        run: sed -i -E "s/(profile-(dark|light)\.svg)\?v=[0-9]+/\1?v=${{ github.run_number }}/g" README.md

      - name: Commit if changed
        run: |
          git config user.name "zaccesssbot"
          git config user.email "automation@isaacadjei.me"
          git add profile/ README.md
          git diff --staged --quiet || git commit -m "chore: refresh profile card stats"
          git push
